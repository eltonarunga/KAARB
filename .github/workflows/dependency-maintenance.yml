name: K-AARB dependency maintenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply non-breaking security fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Generate npm security audit
        run: npm audit --json > npm-audit.json || true
      - name: Summarize audit findings
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('npm audit severity counts:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log([
              name,
              'severity=' + item.severity,
              'direct=' + item.isDirect,
              'range=' + item.range,
              'fixAvailable=' + JSON.stringify(item.fixAvailable)
            ].join(' | '));
            for (const via of item.via ?? []) {
              if (typeof via === 'object') {
                console.log('  advisory:', via.title, '|', via.url, '| range:', via.range);
              }
            }
          }
          NODE
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: kaarb-npm-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize K-AARB npm lockfile"
          git push origin HEAD:main
